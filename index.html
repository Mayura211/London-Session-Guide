</style><body><header><div><small>TRADING PLAYBOOK</small><h1>London Session Guide</h1></div><nav aria-label="Pages"><button id="guideTab" class="active" aria-pressed="true">London Session Guide</button><button id="checkTab" aria-pressed="false">Backtest Confirmation</button></nav></header><div id="calendar"><div class="calendar-card"><small>BACKTEST JOURNAL</small><h2>Select a trading date</h2><p class="cal-help">Choose a date to open its checklist and chart evidence.</p><div class="cal-head"><button id="monthPrev" aria-label="Previous month">←</button><h2 id="monthTitle"></h2><button id="monthNext" aria-label="Next month">→</button></div><div id="calGrid" class="cal-grid"></div><p class="cal-help">Green dates contain saved checklist entries or photos.</p><button id="todayBtn">Today</button></div></div><div id="datebar" class="datebar"><button id="backCal">← Calendar</button><strong id="dateTitle"></strong></div><div class="stage"><button id="prev" class="side-arrow" aria-label="Previous topic" title="Previous topic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7M8 12h13"/></svg></button><main id="track" aria-label="Trading topics"></main><button id="next" class="side-arrow" aria-label="Next topic" title="Next topic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7M3 12h13"/></svg></button></div><div id="status" role="status" style="position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden"></div><script>
const data=[['A','When Is The London Session Not Ideal?',['After a large range day greater than 2 times the 5 day ADR.','After a series of 3 consecutive Up Closes – avoid Longs.','After a series of 3 consecutive Down Closes – avoid Shorts.','After a FOMC event that produces extreme whipsaw.','Ahead of Non-Farm Payroll numbers.','The same day trading is heading into a long weekend – holiday.','Multiple High to Medium Impact News Drivers for that particular Market.','An absence of any News during London can be a “wildcard” day.']],['B','What Characteristics Do I Look For?',['The CBDR is greater than 50 pips. [Possibly Pass On London]','The Asian Range is greater than 40 pips. [Consider Delayed Protraction]','The Market starts a sustained rally or decline from 8:00 pm NY. [Poor]','If CBDR and or Asian Range is not visually consolidating… avoid London.','We aim for days when the bank will “hold” the market to build Open Float.','If the Market is trending from 8:00 pm NY – London becomes sloppy.','When the Market is conditioned for London Slop – sleep in & trade NYO.','Accumulation – Manipulation – Distribution is the business intraday.']],['C','When Is London Open Killzone Ideal?',['The Daily chart is clearly respecting PD Arrays.','The Market has recently responded off a HTF PD Array & not met an opposing PD Array.','When the Market is poised to trade higher on the Daily to Premium Arrays – London Longs are ideal.','When the Market is poised to trade lower on the Daily to Discount Arrays – London Shorts are ideal.','When the daily range has not recently exceeded its 5 day ADR – Expansion Day is due to form.']]];
const track=document.querySelector('#track'),status=document.querySelector('#status');let current=0;const slides=[];let storageOK=true;try{localStorage.setItem('lsg_test','1');localStorage.removeItem('lsg_test')}catch(e){storageOK=false;status.textContent='Local saving unavailable'}
let mode="guide"; const positions={guide:0,check:0}; function render(){track.replaceChildren();slides.length=0;track.classList.toggle("check-mode",mode==="check");data.forEach(([id,title,items],i)=>{const s=document.createElement('section');s.innerHTML=`<small>TOPIC ${String(i+1).padStart(2,'0')} / 03</small><h2></h2><div class="rules"></div>`;s.querySelector('h2').textContent=title;items.forEach((item,j)=>{const card=document.createElement(mode==='check'?'label':'article');card.className='rule';const letter=String.fromCharCode(65+j);card.innerHTML='<div class="statement"><span class="letter"></span><span class="wording"></span></div><textarea placeholder="Add your own notes here…" spellcheck="true"></textarea>';card.querySelector('.letter').textContent=letter+')';card.querySelector('.wording').textContent=item;if(mode==='check'){card.querySelector('textarea').remove();const c=document.createElement('input');c.type='checkbox';c.setAttribute('aria-label',letter+') '+item);card.querySelector('.statement').prepend(c);const k='lsg_daily_'+selectedDate+'_'+i+'_'+j;try{c.checked=localStorage.getItem(k)==='1'}catch(e){}c.addEventListener('change',()=>{try{localStorage.setItem(k,c.checked?'1':'0')}catch(e){status.textContent='Unable to save checkbox'}});s.querySelector('.rules').append(card);return;}const t=card.querySelector('textarea');t.setAttribute('aria-label',title+' — rule '+letter+' notes');const key='lsg_v2_'+i+'_'+j;try{t.value=localStorage.getItem(key)||''}catch(e){}t.addEventListener('input',()=>{try{localStorage.setItem(key,t.value);status.textContent='Notes saved locally ✓'}catch(e){status.textContent='Unable to save notes';t.setCustomValidity('Unable to save notes locally');t.reportValidity()}});s.querySelector('.rules').append(card)});if(mode==='check') addPhoto(s,i);track.append(s);slides.push(s)});track.scrollTo({left:positions[mode]*track.clientWidth,behavior:"instant"});update();}
function update(){current=Math.max(0,Math.min(2,Math.round(track.scrollLeft/Math.max(1,track.clientWidth))));document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===2}function go(i){if(i>=0&&i<3)track.scrollTo({left:i*track.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}document.querySelector('#prev').addEventListener('click',()=>go(current-1));document.querySelector('#next').addEventListener('click',()=>go(current+1));track.addEventListener('scroll',update,{passive:true});addEventListener('resize',()=>{track.scrollTo({left:current*track.clientWidth,behavior:'instant'});update()});addEventListener('keydown',e=>{if(!selectedDate&&mode==='check'||e.target.matches('textarea,input,button,[contenteditable]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();go(current+(e.key==='ArrowRight'?1:-1))}});track.addEventListener('wheel',e=>{if(e.target.closest('textarea'))return;const s=slides[current];if(s.scrollHeight>s.clientHeight+2&&Math.abs(e.deltaY)>Math.abs(e.deltaX))return;if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();track.scrollLeft+=e.deltaY}}, {passive:false});function switchPage(next){if(next===mode)return;positions[mode]=current;mode=next;document.querySelector('#guideTab').classList.toggle('active',mode==='guide');document.querySelector('#checkTab').classList.toggle('active',mode==='check');document.querySelector('#guideTab').setAttribute('aria-pressed',mode==='guide');document.querySelector('#checkTab').setAttribute('aria-pressed',mode==='check');document.querySelector('h1').textContent=mode==='guide'?'London Session Guide':'Backtest Confirmation';if(mode==='check') showCalendar();else{selectedDate=null;calendar.classList.remove('show');datebar.classList.remove('show');stage.classList.remove('hidden');render();}}document.querySelector('#guideTab').onclick=()=>switchPage('guide');document.querySelector('#checkTab').onclick=()=>{if(mode==='check')showCalendar();else switchPage('check')};
const calendar=document.querySelector('#calendar'),datebar=document.querySelector('#datebar'),stage=document.querySelector('.stage');let selectedDate=null;let month=new Date();const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function showCalendar(){selectedDate=null;stage.classList.add('hidden');datebar.classList.remove('show');calendar.classList.add('show');renderCalendar()}
function renderCalendar(){const y=month.getFullYear(),m=month.getMonth(),g=document.querySelector('#calGrid');document.querySelector('#monthTitle').textContent=month.toLocaleDateString('en',{month:'long',year:'numeric'});g.replaceChildren();for(const w of ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']){const el=document.createElement('div');el.className='weekday';el.textContent=w;g.append(el)}for(let i=0;i<(new Date(y,m,1).getDay()+6)%7;i++)g.append(document.createElement('span'));for(let n=1;n<=new Date(y,m+1,0).getDate();n++){const d=dateKey(new Date(y,m,n)),b=document.createElement('button');b.className='day';b.textContent=n;if(d===dateKey(new Date()))b.classList.add('today');let count=0,photos=0;try{data.forEach((a,i)=>{a[2].forEach((_,j)=>{if(localStorage.getItem('lsg_daily_'+d+'_'+i+'_'+j)==='1')count++});photos+=Number(localStorage.getItem('lsg_photo_'+d+'_'+i+'_count')||0)||(localStorage.getItem('lsg_photo_'+d+'_'+i)?1:0)})}catch(e){}if(count||photos){b.classList.add('recorded');const info=document.createElement('small');info.textContent=count+'/21'+(photos?' • 📷':'');b.append(info)}b.onclick=()=>openDate(d);g.append(b)}}
function openDate(d){selectedDate=d;positions.check=0;calendar.classList.remove('show');stage.classList.remove('hidden');datebar.classList.add('show');document.querySelector('#dateTitle').textContent=new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'long',year:'numeric',month:'long',day:'numeric'});render();stage.classList.remove('enter');void stage.offsetWidth;stage.classList.add('enter')}
const dbPromise=new Promise((resolve,reject)=>{try{const r=indexedDB.open('LondonSessionEvidence',1);r.onupgradeneeded=()=>r.result.createObjectStore('gallery');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}});dbPromise.catch(()=>{});
async function galleryRead(k){const db=await dbPromise;return new Promise((res,rej)=>{const r=db.transaction('gallery').objectStore('gallery').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function galleryWrite(k,v){const db=await dbPromise;return new Promise((res,rej)=>{const t=db.transaction('gallery','readwrite');t.objectStore('gallery').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
function addPhoto(section,i){const key='lsg_photo_'+selectedDate+'_'+i,area=document.createElement('div');area.className='photo-area';area.innerHTML=`<div class="photo-head"><div><strong>Chart evidence</strong><div class="cal-help">Attach screenshots and add a note to each image.</div></div><span class="photo-count"></span></div><label class="upload-label">＋ Add chart photos · Select multiple images<input class="file-picker" type="file" multiple accept="image/*"></label><div class="gallery"></div><div class="photo-msg" role="status"></div>`;section.append(area);const input=area.querySelector('input'),grid=area.querySelector('.gallery'),msg=area.querySelector('.photo-msg');let entries=[],queue=Promise.resolve();input.disabled=true;
function save(){const snapshot=entries.map(x=>({...x}));queue=queue.catch(()=>{}).then(()=>galleryWrite(key,snapshot)).then(()=>{try{if(snapshot.length)localStorage.setItem(key+'_count',String(snapshot.length));else localStorage.removeItem(key+'_count')}catch(e){}msg.textContent='Saved locally.'}).catch(()=>{msg.textContent='Could not save. Browser storage may be full or unavailable.'});return queue}
function draw(){grid.replaceChildren();area.querySelector('.photo-count').textContent=entries.length+' photos';entries.forEach((entry,n)=>{const card=document.createElement('article');card.className='photo-card';const img=document.createElement('img');img.alt='Chart evidence '+(n+1);img.src=entry.src;img.onclick=()=>{const d=document.createElement('dialog'),p=document.createElement('img'),close=document.createElement('button');p.src=entry.src;close.textContent='Close';close.onclick=()=>d.close();d.append(p,close);document.body.append(d);d.onclose=()=>d.remove();d.showModal()};const meta=document.createElement('div');meta.className='photo-meta';const title=document.createElement('strong');title.textContent='Photo '+(n+1);const remove=document.createElement('button');remove.textContent='Remove';remove.onclick=()=>{if(!confirm('Remove this photo and its note?'))return;entries=entries.filter(x=>x!==entry);draw();save()};meta.append(title,remove);const note=document.createElement('textarea');note.placeholder='Write a short note about this chart…';note.setAttribute('aria-label','Note for photo '+(n+1));note.value=entry.note||'';note.oninput=()=>{entry.note=note.value;save()};card.append(img,meta,note);grid.append(card)})}
(async()=>{try{const saved=await galleryRead(key);if(saved!==undefined)entries=saved;else{const old=localStorage.getItem(key);if(old){entries=[{src:old,note:''}];await galleryWrite(key,entries);localStorage.setItem(key+'_count','1');localStorage.removeItem(key)}}draw();input.disabled=false}catch(e){msg.textContent='Photo storage is unavailable in this browser.'}})();
input.onchange=async()=>{const files=Array.from(input.files);input.value='';input.disabled=true;let failed=0;for(const f of files){try{const src=await new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const p=new Image();p.onerror=rej;p.onload=()=>res(r.result);p.src=r.result};r.readAsDataURL(f)});entries.push({src,note:''})}catch(e){failed++}}draw();await save();if(failed)msg.textContent+=' '+failed+' invalid image(s) skipped.';input.disabled=false};}
document.querySelector('#monthPrev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar()};document.querySelector('#monthNext').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar()};document.querySelector('#todayBtn').onclick=()=>{month=new Date();renderCalendar()};document.querySelector('#backCal').onclick=showCalendar;render();</script></body></html>
