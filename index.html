<button id="lsgUpdate" type="button">↻ Update</button>
<dialog id="lsgUpdateDialog"><h2>Application update</h2><p id="lsgVersion"></p><p id="lsgUpdateStatus" role="status">Check for a new version.</p><progress id="lsgProgress" max="100" value="0"></progress><div class="update-actions"><button id="lsgDownload">Check &amp; download</button><button id="lsgInstall" disabled>Install &amp; restart</button><button id="lsgClose">Close</button></div></dialog>
<script>
(()=>{const q=id=>document.getElementById(id),d=q('lsgUpdateDialog'),status=q('lsgUpdateStatus'),download=q('lsgDownload'),install=q('lsgInstall');let timer=null,busy=false;
const api=()=>window.pywebview?.api;

})();
</script></body></html>
