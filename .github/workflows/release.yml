name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: london-session-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare and validate resources
        shell: python
        run: |
          import pathlib, re, subprocess
          p = pathlib.Path('index.html')
          version = pathlib.Path('version.txt').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          source = p.read_text(encoding='utf-8')
          assert '__LSG_VERSION__' in source
          source = source.replace('__LSG_VERSION__', version)
          p.write_text(source, encoding='utf-8')
          for script in re.findall(r'<script>(.*?)</script>', source, re.S):
              subprocess.run(['node','--check','-'], input=script, text=True, encoding='utf-8', check=True)
      - name: Install dependencies
        run: python -m pip install -r requirements.txt Pillow
      - name: Generate application icon
        run: python make_icon.py
      - name: Build desktop app
        run: python -m PyInstaller --noconfirm --onefile --windowed --name LondonSessionGuide --icon icon.ico --add-data "index.html;." --add-data "version.txt;." app.py
      - name: Compile installer
        shell: pwsh
        run: |
          $env:LSG_VERSION = (Get-Content version.txt).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LondonSessionGuide-Windows
          path: installer/LondonSessionGuide_Setup.exe
          if-no-files-found: error
      - name: Publish version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.txt).Trim()
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Version already published; increase version.txt for updates."; exit 0 }
          gh release create "v$version" installer/LondonSessionGuide_Setup.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "London Session Guide $version" --notes "Windows installer with in-app update checking. Local records remain on the device."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
